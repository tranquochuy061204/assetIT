name: assetflow

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: ${ASSETFLOW_REGISTRY:-ghcr.io/duclamtk39}/assetflow-backend:${ASSETFLOW_VERSION:-edge}
    pull_policy: always
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${ASSETFLOW_VERSION:-edge}
      CORS_ORIGIN: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: "false"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@12345678}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DIRECTORY_ENCRYPTION_KEY: ${DIRECTORY_ENCRYPTION_KEY:-w5Kx8q9V2mT4jP7sY1bN0cE3zL6uF8aR2dG5hI8kJ1M=}
      ALLOW_INSECURE_LDAP: "false"
      ENABLE_SWAGGER: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      RUN_DATABASE_MIGRATIONS: "true"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    dns:
      - 10.1.1.26
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - assetflow_documents:/var/lib/assetflow/documents
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    logging: *default-logging

  web:
    image: ${ASSETFLOW_REGISTRY:-ghcr.io/duclamtk39}/assetflow-frontend:${ASSETFLOW_VERSION:-edge}
    pull_policy: always
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    dns:
      - 10.1.1.26
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    logging: *default-logging

networks:
  edge:

volumes:
  assetflow_documents:
