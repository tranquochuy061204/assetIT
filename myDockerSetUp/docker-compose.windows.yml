name: vms-dashboard

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.windows
    container_name: vms-dashboard
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - ./server/inputs:C:/app/server/inputs
      - ./server/processed:C:/app/server/processed
    restart: unless-stopped
